<!DOCTYPE html>
<html>
<head>
    <title>String Method and Math Object</title>
</head>

<style>
  body {
      background-color: white;
      font-family: "Times New Roman", serif;
  }

  h2 {
      color: red;
  }

  p {
      color: darkblue;
  }

  .string-output {
      color: darkgreen;
  }

  .math-output {
      color: darkgreen;
  }
</style>
<body>
<center>

<h2><u><font color="red">STRING METHOD</font></u></h2>
<p><b>JavaScript String Methods</b></p>

<div class="string-output">
<script>
var name = "I am Mushina Musthafa K p";

document.write(name);
document.write("<br>");

document.write("Length of string is: ");
document.write(name.length);
document.write("<br>");

document.write("Index of first occurrence of a in string is: ");
document.write(name.indexOf("a"));
document.write("<br>");

document.write("Index of last occurrence of a in string is: ");
document.write(name.lastIndexOf("a"));
document.write("<br>");

document.write("Index of 'am' in string: ");
document.write(name.search("am"));
document.write("<br>");

document.write("Index 0 to 3 printed using slice: ");
document.write(name.slice(0, 4));
document.write("<br>");

document.write("To get substring using substring: ");
document.write(name.substring(0, 8));
document.write("<br>");

document.write("To get substring using substr: ");
document.write(name.substr(0, 3));
document.write("<br>");

document.write("String to upper case: ");
document.write(name.toUpperCase());
document.write("<br>");

document.write("Replace Mushina with Mubeena: ");
document.write(name.replace("Mushina", "Mubeena"));
document.write("<br>");

document.write("Use trim: ");
document.write(name.trim());
document.write("<br>");

document.write("Character at index 5 in string: ");
document.write(name.charAt(5));
document.write("<br>");

document.write("ASCII value of character at index 5: ");
document.write(name.charCodeAt(5));
document.write("<br>");
</script>
</div>


<h2><u><font color="red">MATH OBJECT</font></u></h2>

<p>
<b>
Math object is a built-in object that contains basic mathematical
functions and constants.
</b>
</p>

<div class="math-output">
<script>
document.write("Value of PI in radians: ");
document.write(Math.PI);
document.write("<br>");

document.write("PI in degrees: ");
document.write(Math.PI * 180 / Math.PI);
document.write("<br>");

document.write("Sign of -3: ");
document.write(Math.sign(-3));
document.write("<br>");

document.write("Square root of 8: ");
document.write(Math.sqrt(8));
document.write("<br>");

document.write("Second power of 8: ");
document.write(Math.pow(8, 2));
document.write("<br>");

document.write("Round value of 6.7: ");
document.write(Math.round(6.7));
document.write("<br>");

document.write("Ceil value of 4.4: ");
document.write(Math.ceil(4.4));
document.write("<br>");

document.write("Floor value of 4.4: ");
document.write(Math.floor(4.4));
document.write("<br>");
</script>
</div>

</center>
</body>
</html>
