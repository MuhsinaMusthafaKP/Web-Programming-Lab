<!DOCTYPE html>
<html>
<head>
<title>Calendar</title>

<style>
    body {
        font-family: Arial;
        text-align: center;
    }

    table {
        margin: 20px auto;
        border-collapse: collapse;
    }

    th, td {
        border: 1px solid #ddd;
        padding: 10px;
    }

    .sunday {
        color: red;
    }

    .second-saturday {
        color: red;
    }
</style>
</head>

<body>

<h2>Calendar</h2>

<label for="year">Enter Year:</label>
<input type="number" id="year" placeholder="Enter Year" min="1">

<label for="month">Enter Month:</label>
<input type="number" id="month" placeholder="Enter Month" min="1" max="12">

<button onclick="generateCalendar()">Generate Calendar</button>

<div id="calendar_container"></div>

<script>
function generateCalendar() {

const year = Number(document.getElementById('year').value);
const month = Number(document.getElementById('month').value);

const calendarContainer = document.getElementById('calendar_container');

if (!year || year < 1 || !Number.isInteger(year) ||
    !month || month < 1 || month > 12 || !Number.isInteger(month)) {

    alert('Please enter a valid year and month');
    calendarContainer.innerHTML = '';
    return;
}

const daysInMonth = new Date(year, month, 0).getDate();
const firstDay = new Date(year, month - 1, 1).getDay();

let calendarHTML = "<table>";

calendarHTML += `
    <tr>
        <th>Sun</th>
        <th>Mon</th>
        <th>Tue</th>
        <th>Wed</th>
        <th>Thu</th>
        <th>Fri</th>
        <th>Sat</th>
    </tr>
`;

let dayCounter = 1;

for (let i = 0; i < 6; i++) {

    calendarHTML += '<tr>';

    for (let j = 0; j < 7; j++) {

        if (i === 0 && j < firstDay) {
            calendarHTML += '<td></td>';
        }

        else if (dayCounter <= daysInMonth) {

            const currentDate = new Date(year, month - 1, dayCounter);

            const isSunday = currentDate.getDay() === 0;

            const isSecondSaturday =
                currentDate.getDay() === 6 &&
                Math.ceil(dayCounter / 7) === 2;

            let className = '';

            if (isSunday) {
                className = 'sunday';
            }
            else if (isSecondSaturday) {
                className = 'second-saturday';
            }

            calendarHTML += `
                <td class="${className}"
                    onclick="alert('You clicked on ${currentDate.toDateString()}')">
                    ${dayCounter}
                </td>
            `;

            dayCounter++;
        }

        else {
            calendarHTML += '<td></td>';
        }
    }

    calendarHTML += '</tr>';

    if (dayCounter > daysInMonth) {
        break;
    }
}

calendarHTML += '</table>';

calendarContainer.innerHTML = calendarHTML;
}
</script>

</body>
</html>
